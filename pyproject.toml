[build-system]
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[project]
name = "simulacre-finance"
version = "0.2.0"
description = "Portfolio research, risk, bonds and optional public macroeconomic DataFrames"
keywords = ["finance", "portfolio-optimization", "risk", "bonds", "backtesting", "moex"]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Tuskul Kaigorodov"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/KaigorodovTuskul/simulacre-finance"
Repository = "https://github.com/KaigorodovTuskul/simulacre-finance"
Documentation = "https://github.com/KaigorodovTuskul/simulacre-finance#readme"
Issues = "https://github.com/KaigorodovTuskul/simulacre-finance/issues"
Changelog = "https://github.com/KaigorodovTuskul/simulacre-finance/blob/main/CHANGELOG.md"

[project.optional-dependencies]
http = ["httpx>=0.27,<1"]
macro = ["httpx>=0.27,<1", "pandas>=2.2,<4", "defusedxml>=0.7,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "scipy-stubs>=1.15", "build>=1.2,<2", "twine>=6,<7", "httpx>=0.27,<1", "pandas>=2.2,<4", "pandas-stubs>=2.2,<4", "defusedxml>=0.7,<1", "types-defusedxml>=0.7,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/simulacre_finance"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE", "/pyproject.toml", "/.gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
